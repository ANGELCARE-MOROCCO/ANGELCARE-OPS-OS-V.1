plugins {
    id 'com.android.application'
}

// A preview signing key is retained OFF-REPO and restored exclusively through
// encrypted GitHub Actions secrets. This project must never embed its private key.
def previewKeystorePath = System.getenv('ANGELCARE_PREVIEW_KEYSTORE_PATH')
def previewKeystorePassword = System.getenv('ANGELCARE_PREVIEW_KEYSTORE_PASSWORD')

android {
    namespace 'com.angelcare.marketplace'
    compileSdk 36

    defaultConfig {
        applicationId 'com.angelcare.marketplace'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
    }

    signingConfigs {
        angelcarePreview {
            if (!previewKeystorePath || !previewKeystorePassword) {
                throw new GradleException('ANGELCARE_PREVIEW_SIGNING_MISSING: configure dedicated GitHub Actions secrets. Do not fall back to a runner debug key.')
            }
            storeFile file(previewKeystorePath)
            storeType 'pkcs12'
            storePassword previewKeystorePassword
            keyAlias 'angelcare-preview'
            keyPassword previewKeystorePassword
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            debuggable true
            signingConfig signingConfigs.angelcarePreview
        }
        release {
            minifyEnabled false
            // Release bundle remains deliberately unsigned.
            // Play App Signing / production identity are a separate approval gate.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
