name: AngelCare Equipment R11.1 — Universal Language and Mobile Parity
on:
  push:
    branches:
      - feat/equipment-r111-universal-language-mobile-parity-20261117
    paths:
      - 'apps/marketplace-web/app/angelcare-marketplace/[locale]/establishments/page.tsx'
      - 'apps/marketplace-web/angelcare-marketplace/establishments-world/**'
      - 'apps/marketplace-web/tsconfig.equipment-r111.json'
      - 'apps/marketplace-web/scripts/verify-equipment-r111.test.mjs'
      - 'apps/marketplace-web/scripts/verify-equipment-r11.test.mjs'
      - '.github/workflows/establishments-equipment-r111.yml'
  pull_request:
    branches:
      - feat/equipment-r11-signature-hero-native-discovery-20261117
    paths:
      - 'apps/marketplace-web/app/angelcare-marketplace/[locale]/establishments/page.tsx'
      - 'apps/marketplace-web/angelcare-marketplace/establishments-world/**'
      - 'apps/marketplace-web/tsconfig.equipment-r111.json'
      - '.github/workflows/establishments-equipment-r111.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equipment-r111:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketplace-web/package-lock.json
      - name: FR EN AR route parity, domain localization and mobile interactions
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-equipment-r111.test.mjs
      - name: Preserve R11 signature hero and native catalogue
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-equipment-r11.test.mjs
      - name: Preserve R10 world experience
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-equipment-r10.test.mjs
      - name: Preserve R9 unique layouts
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-equipment-r9.test.mjs
      - name: Preserve R8 catalogue and project
        working-directory: apps/marketplace-web
        run: node --experimental-strip-types --test scripts/verify-equipment-r8.test.mjs
      - name: Install locked dependencies
        working-directory: apps/marketplace-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict three-language TypeScript
        working-directory: apps/marketplace-web
        run: npx tsc -p tsconfig.equipment-r111.json --noEmit --pretty false
      - name: Original R7.1 rollback exact hash
        working-directory: apps/marketplace-web
        run: |
          test "$(git hash-object angelcare-marketplace/establishments-world/EquipmentHeroR71.tsx)" = "3532b9b0b639987ffcdff601360ac29c6efaa100"
          echo R71_HERO_ROLLBACK_PASS
