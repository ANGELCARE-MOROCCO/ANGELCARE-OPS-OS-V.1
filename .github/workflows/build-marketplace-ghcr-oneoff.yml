name: Build Marketplace GHCR One-Off

on:
  push:
    branches:
      - upgrade/next-angelcare-upgrade
    paths:
      - ".github/workflows/build-marketplace-ghcr-oneoff.yml"
      - "apps/marketplace-web/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact Marketplace source commit to build"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  TARGET_SHA: ${{ inputs.source_sha || github.sha }}
  IMAGE: ghcr.io/angelcare-morocco/angelcare-marketplace

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Marketplace source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify Marketplace source route constitution
        run: node apps/marketplace-web/scripts/release/verify-marketplace-release-constitution.mjs source

      - name: Purge stale Marketplace build outputs
        run: |
          rm -rf apps/marketplace-web/.next
          rm -rf apps/marketplace-web/.turbo
          rm -rf apps/marketplace-web/node_modules/.cache

      - name: Install Nixpacks
        run: curl -sSL https://nixpacks.com/install.sh | bash

      - name: Override Nixpacks auto apt packages
        run: |
          cat > /tmp/nixpacks-ci.toml <<'EOF'
          [phases.setup]
          aptPkgs = []
          EOF

      - name: Show Nixpacks build plan
        run: nixpacks plan apps/marketplace-web --config /tmp/nixpacks-ci.toml

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact Marketplace image
        run: |
          nixpacks build apps/marketplace-web \
            --config /tmp/nixpacks-ci.toml \
            --no-cache \
            --name "${IMAGE}:${TARGET_SHA}" \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${TARGET_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/ANGELCARE-MOROCCO/ANGELCARE-OPS-OS-V.1"

      - name: Verify compiled Marketplace route constitution
        shell: bash
        run: |
          set -euo pipefail

          CID="$(docker create "${IMAGE}:${TARGET_SHA}")"
          ARCHIVE="/tmp/angelcare-marketplace-candidate.tar"
          EXTRACT="/tmp/angelcare-marketplace-manifests"
          LIST="/tmp/angelcare-marketplace-manifests.txt"

          cleanup() {
            docker rm -f "$CID" >/dev/null 2>&1 || true
            rm -f "$ARCHIVE" "$LIST"
            rm -rf "$EXTRACT"
          }

          trap cleanup EXIT

          rm -f "$ARCHIVE" "$LIST"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "=== EXPORT CANDIDATE FILESYSTEM ==="
          docker export "$CID" > "$ARCHIVE"

          echo "=== DISCOVER APP PATH MANIFESTS ==="
          tar -tf "$ARCHIVE" \
            | grep -E '(^|/)app-paths-manifest\.json$' \
            | sort -u \
            > "$LIST"

          MANIFEST_COUNT="$(wc -l < "$LIST" | tr -d ' ')"

          echo "APP_PATH_MANIFESTS_IN_IMAGE=$MANIFEST_COUNT"

          if [ "$MANIFEST_COUNT" -lt 1 ]; then
            echo "STOP — no app-paths-manifest.json found in candidate image."
            exit 1
          fi

          sed -n '1,120p' "$LIST"

          echo "=== EXTRACT MANIFESTS ONLY ==="

          while IFS= read -r MANIFEST; do
            [ -n "$MANIFEST" ] || continue

            tar -xf "$ARCHIVE" \
              -C "$EXTRACT" \
              "$MANIFEST"
          done < "$LIST"

          echo "=== VERIFY COMPILED ROUTE CONSTITUTION ==="

          NEXT_DIR="$EXTRACT" \
            node apps/marketplace-web/scripts/release/verify-marketplace-release-constitution.mjs compiled

      - name: Verify Marketplace runtime identity inside candidate image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="${IMAGE}:${TARGET_SHA}"

          MARKET_BODY="/tmp/marketplace-fr.html"
          SANILA_BODY="/tmp/sanila.html"
          ROOT_HEADERS="/tmp/root.headers"

          CID=""

          cleanup() {
            [ -z "${CID:-}" ] || docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "============================================================"
          echo "BOOT EXACT CANDIDATE IMAGE"
          echo "IMAGE_REF=${IMAGE_REF}"
          echo "============================================================"

          CID="$(docker run -d -p 127.0.0.1::3000 "$IMAGE_REF")"
          echo "CID=${CID}"

          HOST_PORT=""
          CODE="000"

          for N in $(seq 1 180); do
            HOST_PORT="$(
              docker port "$CID" 3000/tcp 2>/dev/null |
              head -1 |
              awk -F: '{print $NF}' |
              tr -d '[:space:]'
            )"

            if [ -n "${HOST_PORT}" ]; then
              CODE="$(
                curl -sS \
                  -o "$MARKET_BODY" \
                  -w '%{http_code}' \
                  "http://127.0.0.1:${HOST_PORT}/angelcare-marketplace/fr" \
                  2>/dev/null || true
              )"

              [ "$CODE" = "200" ] && break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$CID" 2>/dev/null || echo false)" != "true" ]; then
              echo "FAIL: candidate container exited"
              docker logs "$CID" || true
              exit 1
            fi

            sleep 1
          done

          echo "HOST_PORT=${HOST_PORT}"
          echo "MARKETPLACE_HTTP=${CODE}"

          [ "$CODE" = "200" ] || {
            echo "FAIL: Marketplace FR did not reach HTTP 200"
            docker logs "$CID" || true
            exit 1
          }

          # ------------------------------------------------------------
          # Parse actual rendered DOM.
          # Script/style contents are ignored, therefore Next RSC payload
          # strings cannot create false SANILA matches.
          # ------------------------------------------------------------
          python3 - "$MARKET_BODY" <<'PYDOM'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys

          class VisibleDOM(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.hidden = 0
                  self.marketplace_variant = False
                  self.sanila_page = False
                  self.text = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()

                  if tag in {"script", "style", "noscript"}:
                      self.hidden += 1
                      return

                  if self.hidden:
                      return

                  values = dict(attrs)

                  if values.get("data-variant") == "marketplace":
                      self.marketplace_variant = True

                  if values.get("data-page") == "accueil":
                      self.sanila_page = True

              def handle_endtag(self, tag):
                  if tag.lower() in {"script", "style", "noscript"} and self.hidden:
                      self.hidden -= 1

              def handle_data(self, data):
                  if not self.hidden:
                      value = " ".join(data.split())
                      if value:
                          self.text.append(value)

          html = Path(sys.argv[1]).read_text(errors="replace")

          parser = VisibleDOM()
          parser.feed(html)

          visible = " ".join(parser.text)
          visible = re.sub(r"\s+", " ", visible).strip()

          marketplace_identity = (
              "GLOBAL MARKETPLACE" in visible.upper()
              or "ANGELCARE MARKET PLACE" in visible.upper()
              or "BIENVENUE DANS VOTRE UNIVERS ANGELCARE" in visible.upper()
          )

          print(
              "DOM_MARKETPLACE_VARIANT="
              + ("YES" if parser.marketplace_variant else "NO")
          )

          print(
              "DOM_SANILA_ACCUEIL="
              + ("YES" if parser.sanila_page else "NO")
          )

          print(
              "VISIBLE_MARKETPLACE_IDENTITY="
              + ("YES" if marketplace_identity else "NO")
          )

          if not parser.marketplace_variant:
              raise SystemExit(
                  "FAIL: rendered DOM does not identify Marketplace shell"
              )

          if parser.sanila_page:
              raise SystemExit(
                  "FAIL: SANILA accueil is actually rendered at Marketplace FR"
              )

          if not marketplace_identity:
              raise SystemExit(
                  "FAIL: visible Marketplace identity missing"
              )

          print("MARKETPLACE_RENDERED_DOM=PASS")
          PYDOM

          # ------------------------------------------------------------
          # SANILA namespace itself must still work.
          # ------------------------------------------------------------
          SANILA_CODE="$(
            curl -sS \
              -o "$SANILA_BODY" \
              -w '%{http_code}' \
              "http://127.0.0.1:${HOST_PORT}/angelcare-marketplace/fr/sanila"
          )"

          echo "SANILA_HTTP=${SANILA_CODE}"

          [ "$SANILA_CODE" = "200" ] || {
            echo "FAIL: SANILA namespace is not HTTP 200"
            exit 1
          }

          python3 - "$SANILA_BODY" <<'PYSANILA'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class SanilaDOM(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.hidden = 0
                  self.page = False
                  self.text = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() in {"script", "style", "noscript"}:
                      self.hidden += 1
                      return

                  if self.hidden:
                      return

                  values = dict(attrs)

                  if values.get("data-page") == "accueil":
                      self.page = True

              def handle_endtag(self, tag):
                  if tag.lower() in {"script", "style", "noscript"} and self.hidden:
                      self.hidden -= 1

              def handle_data(self, data):
                  if not self.hidden:
                      value = " ".join(data.split())
                      if value:
                          self.text.append(value)

          p = SanilaDOM()
          p.feed(Path(sys.argv[1]).read_text(errors="replace"))

          visible = " ".join(p.text)

          sanila_visible = "SANILA" in visible.upper()

          print(
              "DOM_SANILA_NAMESPACE="
              + ("YES" if (p.page or sanila_visible) else "NO")
          )

          if not (p.page or sanila_visible):
              raise SystemExit(
                  "FAIL: SANILA namespace lacks SANILA rendered identity"
              )

          print("SANILA_NAMESPACE_RENDERER=PASS")
          PYSANILA

          # ------------------------------------------------------------
          # Bare root must point to Marketplace.
          # ------------------------------------------------------------
          curl -sSI \
            "http://127.0.0.1:${HOST_PORT}/" \
            > "$ROOT_HEADERS"

          ROOT_LOCATION="$(
            awk '
              BEGIN { IGNORECASE=1 }
              /^location:/ {
                sub(/\r$/, "", $0)
                sub(/^[Ll]ocation:[[:space:]]*/, "", $0)
                print
                exit
              }
            ' "$ROOT_HEADERS"
          )"

          echo "ROOT_LOCATION=${ROOT_LOCATION}"

          [ "$ROOT_LOCATION" = "/angelcare-marketplace/fr" ] || {
            echo "FAIL: root does not redirect to Marketplace FR"
            exit 1
          }

          echo "ROOT_TO_MARKETPLACE=PASS"

          echo "============================================================"
          echo "MARKETPLACE_CANDIDATE_RUNTIME=PASS"
          echo "MARKETPLACE_RENDERED_DOM=PASS"
          echo "SANILA_NAMESPACE_RENDERER=PASS"
          echo "ROOT_TO_MARKETPLACE=PASS"
          echo "============================================================"

      - name: Set up Node for SEO POWER verification
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Lighthouse CI tooling
        working-directory: apps/marketplace-web/scripts/seo-power-ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit the exact Marketplace candidate with Lighthouse CI
        working-directory: apps/marketplace-web/scripts/seo-power-ci
        shell: bash
        env:
          SEO_POWER_REPORT_ORIGIN: ${{ vars.SEO_POWER_REPORT_ORIGIN || 'https://my.angelcarehub.com' }}
        run: |
          set -euo pipefail
          CID="$(docker run -d -p 127.0.0.1::3000 "${IMAGE}:${TARGET_SHA}")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          PORT="$(docker port "$CID" 3000/tcp | head -1 | awk -F: '{print $NF}')"
          export SEO_CANDIDATE_ORIGIN="http://127.0.0.1:${PORT}"
          for N in $(seq 1 90); do
            if curl -fsS --max-time 10 "$SEO_CANDIDATE_ORIGIN/angelcare-marketplace/fr" >/dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          npx --no-install lhci collect --config=lighthouserc.cjs
          set +e
          npx --no-install lhci assert --config=lighthouserc.cjs
          ASSERT_STATUS=$?
          set -e
          npx --no-install lhci upload --config=lighthouserc.cjs
          node report.mjs
          exit "$ASSERT_STATUS"

      - name: Retain SEO POWER candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-power-${{ env.TARGET_SHA }}
          path: |
            apps/marketplace-web/scripts/seo-power-ci/reports
            apps/marketplace-web/scripts/seo-power-ci/.lighthouseci
            apps/marketplace-web/scripts/seo-power-ci/summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Push exact Marketplace image
        run: docker push "${IMAGE}:${TARGET_SHA}"
