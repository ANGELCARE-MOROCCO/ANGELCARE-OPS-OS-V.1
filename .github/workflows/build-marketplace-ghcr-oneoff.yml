# manual-build-trigger: 20260902-190653
name: Build Marketplace GHCR One-Off

on:
  push:
    branches:
      - upgrade/next-angelcare-upgrade
    paths:
      - ".github/workflows/build-marketplace-ghcr-oneoff.yml"

permissions:
  contents: read
  packages: write

env:
  TARGET_SHA: d1db89aaad9a968f9fb46ed242cb475da72d8ca4
  IMAGE: ghcr.io/angelcare-morocco/angelcare-marketplace

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Marketplace source
        uses: actions/checkout@v4
        with:
          ref: 368fd595955ed9ec93ef7c4172006b773ff5a2d1
      - name: Verify Marketplace source route constitution
        run: node apps/marketplace-web/scripts/release/verify-marketplace-release-constitution.mjs source

      - name: Purge stale Marketplace build outputs
        run: |
          rm -rf apps/marketplace-web/.next
          rm -rf apps/marketplace-web/.turbo
          rm -rf apps/marketplace-web/node_modules/.cache

      - name: Install Nixpacks
        run: curl -sSL https://nixpacks.com/install.sh | bash

      - name: Show Nixpacks build plan
        run: nixpacks plan apps/marketplace-web

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact Marketplace image
        run: |
          nixpacks build apps/marketplace-web \
            --no-cache \
            --name "${IMAGE}:${TARGET_SHA}" \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${TARGET_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/ANGELCARE-MOROCCO/ANGELCARE-OPS-OS-V.1"

      - name: Verify compiled Marketplace route constitution
        shell: bash
        run: |
          set -euo pipefail

          CID="$(docker create "${IMAGE}:${TARGET_SHA}")"
          ARCHIVE="/tmp/angelcare-marketplace-candidate.tar"
          EXTRACT="/tmp/angelcare-marketplace-manifests"
          LIST="/tmp/angelcare-marketplace-manifests.txt"

          cleanup() {
            docker rm -f "$CID" >/dev/null 2>&1 || true
            rm -f "$ARCHIVE" "$LIST"
            rm -rf "$EXTRACT"
          }

          trap cleanup EXIT

          rm -f "$ARCHIVE" "$LIST"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "=== EXPORT CANDIDATE FILESYSTEM ==="
          docker export "$CID" > "$ARCHIVE"

          echo "=== DISCOVER APP PATH MANIFESTS ==="
          tar -tf "$ARCHIVE" \
            | grep -E '(^|/)app-paths-manifest\.json$' \
            | sort -u \
            > "$LIST"

          MANIFEST_COUNT="$(wc -l < "$LIST" | tr -d ' ')"

          echo "APP_PATH_MANIFESTS_IN_IMAGE=$MANIFEST_COUNT"

          if [ "$MANIFEST_COUNT" -lt 1 ]; then
            echo "STOP — no app-paths-manifest.json found in candidate image."
            exit 1
          fi

          sed -n '1,120p' "$LIST"

          echo "=== EXTRACT MANIFESTS ONLY ==="

          while IFS= read -r MANIFEST; do
            [ -n "$MANIFEST" ] || continue

            tar -xf "$ARCHIVE" \
              -C "$EXTRACT" \
              "$MANIFEST"
          done < "$LIST"

          echo "=== VERIFY COMPILED ROUTE CONSTITUTION ==="

          NEXT_DIR="$EXTRACT" \
            node apps/marketplace-web/scripts/release/verify-marketplace-release-constitution.mjs compiled

      - name: Verify Marketplace runtime identity inside candidate image
        run: |
          set -euo pipefail

          IMAGE_REF="${IMAGE}:${TARGET_SHA}"

          echo "========================================================================"
          echo "MARKETPLACE CANDIDATE IMAGE — REAL RUNTIME GATE"
          echo "========================================================================"
          echo "IMAGE_REF=${IMAGE_REF}"

          BODY="$(mktemp)"
          ROOT_HEADERS="$(mktemp)"
          CONTAINER_LOG="$(mktemp)"
          CID=""

          cleanup_runtime() {
            if [ -n "${CID:-}" ]; then
              docker rm -f "$CID" >/dev/null 2>&1 || true
            fi
            rm -f "$BODY" "$ROOT_HEADERS" "$CONTAINER_LOG"
          }

          trap cleanup_runtime EXIT

          echo
          echo "=== START CANDIDATE IMAGE ==="

          CID="$(
            docker run \
              -d \
              -p 127.0.0.1::3000 \
              "$IMAGE_REF"
          )"

          echo "CID=$CID"

          HOST_PORT=""

          for ATTEMPT in $(seq 1 180); do

            HOST_PORT="$(
              docker port "$CID" 3000/tcp 2>/dev/null \
                | head -1 \
                | awk -F: '{print $NF}' \
                | tr -d '[:space:]'
            )"

            if [ -n "${HOST_PORT:-}" ]; then
              CODE="$(
                curl \
                  -sS \
                  -o "$BODY" \
                  -w '%{http_code}' \
                  "http://127.0.0.1:${HOST_PORT}/angelcare-marketplace/fr" \
                  2>/dev/null || true
              )"

              if [ "$CODE" = "200" ]; then
                break
              fi
            fi

            RUNNING="$(
              docker inspect \
                -f '{{.State.Running}}' \
                "$CID" 2>/dev/null || echo false
            )"

            if [ "$RUNNING" != "true" ]; then
              echo "FAIL: candidate container exited."

              docker logs "$CID" \
                > "$CONTAINER_LOG" 2>&1 || true

              tail -n 200 "$CONTAINER_LOG"
              exit 1
            fi

            sleep 1
          done

          if [ -z "${HOST_PORT:-}" ]; then
            echo "FAIL: candidate image never exposed port 3000."
            docker logs "$CID" || true
            exit 1
          fi

          echo "HOST_PORT=$HOST_PORT"

          HTTP="$(
            curl \
              -sS \
              -o "$BODY" \
              -w '%{http_code}' \
              "http://127.0.0.1:${HOST_PORT}/angelcare-marketplace/fr"
          )"

          echo "MARKETPLACE_HTTP=$HTTP"

          [ "$HTTP" = "200" ] || {
            echo "FAIL: Marketplace FR did not return HTTP 200."
            docker logs "$CID" || true
            exit 1
          }

          echo
          echo "=== MARKETPLACE IDENTITY TEST ==="

          if grep -Fqi "SANILA Operating System" "$BODY"; then
            echo "FAIL: Marketplace FR renders SANILA Operating System."
            exit 1
          fi

          if grep -Fqi "Tout votre établissement" "$BODY"; then
            echo "FAIL: Marketplace FR renders the old SANILA hero."
            exit 1
          fi

          if grep -Eqi 'data-page=["'\'']accueil["'\'']' "$BODY"; then
            echo "FAIL: Marketplace FR renders SANILA accueil authority."
            exit 1
          fi

          echo "SANILA_AT_MARKETPLACE_ROOT=NO"

          MARKETPLACE_IDENTITY=NO

          if grep -Fqi "GLOBAL MARKETPLACE" "$BODY"; then
            echo "MARKETPLACE_IDENTITY=GLOBAL_MARKETPLACE"
            MARKETPLACE_IDENTITY=YES
          fi

          if grep -Fqi "ANGELCARE MARKET PLACE" "$BODY"; then
            echo "MARKETPLACE_IDENTITY=ANGELCARE_MARKET_PLACE"
            MARKETPLACE_IDENTITY=YES
          fi

          if grep -Eqi "AngelCare.{0,80}Marketplace|Marketplace.{0,80}AngelCare" "$BODY"; then
            echo "MARKETPLACE_IDENTITY=ANGELCARE_MARKETPLACE"
            MARKETPLACE_IDENTITY=YES
          fi

          if [ "$MARKETPLACE_IDENTITY" != "YES" ]; then
            echo "FAIL: expected Marketplace identity absent."
            echo
            echo "HTML excerpt:"
            sed -n '1,100p' "$BODY"
            exit 1
          fi

          echo
          echo "=== ROOT REDIRECT TEST ==="

          curl \
            -sSI \
            "http://127.0.0.1:${HOST_PORT}/" \
            > "$ROOT_HEADERS"

          sed -n '1,20p' "$ROOT_HEADERS"

          ROOT_LOCATION="$(
            awk '
              BEGIN { IGNORECASE=1 }
              /^location:/ {
                sub(/$/, "", $0)
                sub(/^[Ll]ocation:[[:space:]]*/, "", $0)
                print
                exit
              }
            ' "$ROOT_HEADERS"
          )"

          echo "ROOT_LOCATION=$ROOT_LOCATION"

          case "$ROOT_LOCATION" in
            /angelcare-marketplace/fr)
              ;;
            http://*/angelcare-marketplace/fr)
              ;;
            https://*/angelcare-marketplace/fr)
              ;;
            *)
              echo "FAIL: / does not redirect to Marketplace FR."
              exit 1
              ;;
          esac

          echo "ROOT_TO_MARKETPLACE=PASS"

          echo
          echo "========================================================================"
          echo "MARKETPLACE_CANDIDATE_RUNTIME=PASS"
          echo "SANILA_AT_MARKETPLACE_ROOT=NO"
          echo "ROOT_TO_MARKETPLACE=PASS"
          echo "IMAGE_REF=${IMAGE_REF}"
          echo "========================================================================"

      - name: Push exact Marketplace image
        run: docker push "${IMAGE}:${TARGET_SHA}"

# manual-build-trigger: 20260827-133715
