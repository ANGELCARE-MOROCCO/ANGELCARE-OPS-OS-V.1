name: KidFlix Imagery Studio R5 — AngelCare Visual Parity
on:
  push:
    branches:
      - feat/kidflix-imagery-studio-r5-visual-parity-20261119
      - upgrade/next-angelcare-upgrade
    paths:
      - 'apps/marketplace-web/angelcare-marketplace/kidflix/imagery/Studio.tsx'
      - 'apps/marketplace-web/angelcare-marketplace/kidflix/imagery/studio.module.css'
      - 'apps/marketplace-web/tsconfig.kidflix-imagery-r5.json'
      - 'apps/marketplace-web/scripts/verify-kidflix-imagery-studio-r5.test.mjs'
      - '.github/workflows/kidflix-imagery-studio-r5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketplace-web/package-lock.json
      - name: Install locked Marketplace dependencies
        working-directory: apps/marketplace-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact visual parity, KidFlix media authorities and TSX syntax
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-kidflix-imagery-studio-r5.test.mjs
      - name: Typecheck KidFlix Studio and its DCE workspace
        working-directory: apps/marketplace-web
        run: npx tsc -p tsconfig.kidflix-imagery-r5.json --noEmit --pretty false
      - name: Ensure other Imagery Studios remain source-identical
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-hospitality-imagery-r4.test.mjs
