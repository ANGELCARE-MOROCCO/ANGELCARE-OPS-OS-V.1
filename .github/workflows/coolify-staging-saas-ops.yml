name: Coolify Staging - SaaS Ops

on:
  workflow_dispatch:
  push:
    branches:
      - infra/coolify-migration

permissions:
  contents: read
  packages: write

concurrency:
  group: coolify-staging-saas-ops
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/angelcare-morocco/angelcare-saas-ops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare staging build environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' '${{ secrets.SAAS_OPS_STAGING_ENV_B64 }}' \
            | base64 --decode \
            > /tmp/saas-ops-staging.env
          test -s /tmp/saas-ops-staging.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SaaS Ops staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.coolify
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          secret-files: |
            envfile=/tmp/saas-ops-staging.env
          cache-from: type=gha,scope=angelcare-saas-ops
          cache-to: type=gha,mode=max,scope=angelcare-saas-ops

      - name: Remove temporary environment file
        if: always()
        shell: bash
        run: rm -f /tmp/saas-ops-staging.env
