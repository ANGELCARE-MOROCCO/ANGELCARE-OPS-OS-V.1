name: AngelCare Conseil R6 — Immersive School Transformation
on:
  push:
    branches:
      - feat/conseil-programmes-r6-immersive-school-transformation-20261118
      - upgrade/next-angelcare-upgrade
    paths:
      - 'apps/marketplace-web/angelcare-marketplace/establishments-world/**'
      - 'apps/marketplace-web/app/angelcare-marketplace/**'
      - 'apps/marketplace-web/scripts/verify-conseil-r6.test.mjs'
      - '.github/workflows/establishments-conseil-r6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conseil-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketplace-web/package-lock.json
      - name: R6 B2B brochure, diagnostic, offer safety, locale, navigation and responsive regressions
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-conseil-r6.test.mjs
      - name: Equipment R8 through R11.1 compatibility
        working-directory: apps/marketplace-web
        run: |
          node --experimental-strip-types --test scripts/verify-equipment-r8.test.mjs
          node --test scripts/verify-equipment-r9.test.mjs scripts/verify-equipment-r10.test.mjs scripts/verify-equipment-r11.test.mjs scripts/verify-equipment-r111.test.mjs
      - name: Partner OS R2 compatibility
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-partner-os-r2.test.mjs
      - name: Orders 360 R8 compatibility
        working-directory: apps/marketplace-web
        run: node --test scripts/verify-commercial-order-r8.test.mjs
      - name: Install locked Marketplace dependencies
        working-directory: apps/marketplace-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical store route and responsive Conseil R6 TypeScript
        working-directory: apps/marketplace-web
        run: npx tsc -p tsconfig.equipment-r111.json --noEmit --pretty false
      - name: Partner OS R2 isolated strict TypeScript
        working-directory: apps/marketplace-web
        run: npx tsc -p tsconfig.partner-os-r2.json --noEmit --pretty false
      - name: Orders 360 R8 isolated strict TypeScript
        working-directory: apps/marketplace-web
        run: npx tsc -p tsconfig.orders360.json --noEmit --pretty false
