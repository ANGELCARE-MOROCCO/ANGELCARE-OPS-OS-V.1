<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KidFlix · Offline files</title><style>body{font:16px system-ui;background:#faf7ff;color:#27354c;max-width:960px;margin:30px auto;padding:20px}main{background:white;border:1px solid #e2d8f1;border-radius:24px;padding:28px}article{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:15px 0}a,button{padding:12px;border-radius:10px;background:#7048be;color:white;border:0;cursor:pointer}span{flex:1}img{width:150px}p{line-height:1.6}</style><main><img src="/kidflix/kidflix-official.png" alt="KidFlix"><h1 id="title"></h1><p id="hint"></p><div id="files"></div><p id="total"></p><a id="back"></a></main><script>
(async()=>{const raw=new URLSearchParams(location.search).get('locale'),l=['en','fr','ar'].includes(raw)?raw:'en',ar=l==='ar',fr=l==='fr';document.documentElement.lang=l;document.documentElement.dir=ar?'rtl':'ltr';const t=(en,frs,ars)=>ar?ars:fr?frs:en;document.querySelector('#title').textContent=t('Files on this device','Fichiers sur cet appareil','الملفات على هذا الجهاز');document.querySelector('#hint').textContent=t('Prepared files expire after 7 days. Online activities and scoring still require a connection.','Les fichiers préparés expirent après 7 jours. Les activités et la notation nécessitent une connexion.','تنتهي الملفات المجهزة بعد 7 أيام. الأنشطة والتقييم تتطلب اتصالاً.');const back=document.querySelector('#back');back.href='/kidflix/'+l+'/my';back.textContent=t('My KidFlix','Mon KidFlix','مساحتي في كيدفليكس');if(!('caches'in window))throw Error('Storage unavailable');const cache=await caches.open('kidflix-offline-v3');let bytes=0;for(const key of await cache.keys()){if(!new URL(key.url).pathname.startsWith('/kidflix/offline-file/'))continue;const response=await cache.match(key);if(Number(response.headers.get('X-Kidflix-Expires'))<Date.now()){await cache.delete(key);continue;}bytes+=Number(response.headers.get('content-length')||0);const row=document.createElement('article'),name=document.createElement('span'),open=document.createElement('a'),remove=document.createElement('button');name.textContent=decodeURIComponent(response.headers.get('X-Kidflix-Title')||'KidFlix');const blob=await response.blob();open.href=URL.createObjectURL(blob);open.download=name.textContent+(blob.type==='application/pdf'?'.pdf':'.png');open.textContent=t('Download','Télécharger','تنزيل');remove.textContent=t('Remove','Retirer','إزالة');remove.onclick=async()=>{await cache.delete(key);URL.revokeObjectURL(open.href);row.remove();location.reload();};row.append(name,open,remove);document.querySelector('#files').append(row);}document.querySelector('#total').textContent=(bytes/1024/1024).toFixed(1)+' MB / 100 MB';})().catch(()=>{const l=new URLSearchParams(location.search).get('locale');document.querySelector('#hint').textContent=l==='ar'?'تخزين الجهاز غير متاح. حاول مجدداً عند توفر الاتصال.':l==='fr'?'Le stockage de cet appareil est indisponible. Réessayez avec une connexion.':'Device storage is unavailable. Try again with a connection.';});
</script></html>
