services:
  jobkix-supply-worker:
    build: .
    restart: unless-stopped
    environment:
      JOBKIX_SUPPLY_SERVER: ${JOBKIX_SUPPLY_SERVER}
      JOBKIX_SUPPLY_WORKER_KEY: ${JOBKIX_SUPPLY_WORKER_KEY}
      JOBKIX_SUPPLY_POLL_SECONDS: 12
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: '1.0'
